name: Parse interface drift

# ci.yml runs the same check on every push and pull request. This weekly run catches a change
# to POST /v1/parse's answer in the deployed openapi.json while nothing is pushed here: in
# November 2026 the API added pdfInput and the app went 8 days without it.
# A red run means: run `node scripts/parse-interface.mjs`, read the diff, and open a pull
# request that ships the new fields.
# It reads openapi.json only and spends no document, so it starts no live gate.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Parse interface matches the live openapi.json
        run: node scripts/parse-interface.mjs --check
